# Runs every test on each push to main, each pull request, and each release tag:
# the unit tests (core) and the QA click-through tests (desktop/src/test/.../qa),
# which open the real window invisibly and click through it.
name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # A Mac, like the one the app ships for.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run every test
        run: mvn -B install

      # If something fails, keep the details (which screen, what it showed) to look at.
      - name: Save test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
